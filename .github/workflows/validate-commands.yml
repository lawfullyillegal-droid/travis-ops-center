name: Validate and smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python
        run: python -m compileall -q scripts web

      - name: Validate command vault
        run: python scripts/ci_validate.py

      - name: Smoke-test web import
        env:
          SERVER_HOST: 127.0.0.1
          AUTH_USER: ""
          AUTH_PASS: ""
        run: python -c "from web.app import app; assert app.url_map"
