---
# Reference configuration. web/app.py uses environment variables for
# runtime bind/auth settings; keep deployment secrets out of this file.

database:
  path: "data/integrity_ledger.db"
  type: "sqlite3"
  backup_enabled: true
  backup_frequency: "daily"
  backup_retention_days: 30

logging:
  level: "INFO"
  file_path: "logs/audit.log"
  max_file_size_mb: 100
  backup_count: 10
  console_enabled: true

operator:
  name: "lawfullyillegal-droid"
  role: "operator"

case_management:
  default_case_number: ""
  case_directory: "data"
  auto_numbering: true
  archive_old_cases: false

evidence:
  storage_path: "evidence"
  temp_path: "/tmp/travis-evidence"
  auto_hash_verification: true
  hash_algorithm: "sha256"

web:
  host: "127.0.0.1"
  port: 8080
  debug_mode: false
  theme: "dark"

command_execution:
  timeout_seconds: 300
  max_parallel_commands: 1
  capture_stdout: true
  capture_stderr: true
  log_all_commands: true
  require_confirmation: true

security:
  enable_authentication_for_remote_bind: true
  allow_insecure_no_auth: false
  rate_limiting_enabled: false

system:
  auto_sync_vault: false
  cleanup_temp_files: true
  verbose_output: false
  development_mode: false

metadata:
  version: "2.0"
  last_modified: "2026-09-27T00:00:00Z"
  environment: "production-defaults"
